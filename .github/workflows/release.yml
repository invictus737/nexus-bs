name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev file

      - name: Build Debian package
        run: packaging/deb/build-deb.sh

      - name: Generate checksums
        run: |
          cd packaging/deb/dist
          sha256sum *.deb > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/deb/dist/*.deb
            packaging/deb/dist/SHA256SUMS
