name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04-arm
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RUSTFLAGS: "-C target-cpu=cortex-a53"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build and package tools
        run: sudo apt-get update && sudo apt-get install -y binutils build-essential dpkg-dev file libsoapysdr-dev pkg-config python3

      - name: Build release artifacts
        run: scripts/build-release-artifacts.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-bs-${{ github.ref_name }}-arm64
          path: |
            packaging/release/*.deb
            packaging/release/SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/release/*.deb
            packaging/release/SHA256SUMS
