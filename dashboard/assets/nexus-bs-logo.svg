<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" role="img" aria-labelledby="title desc">
  <title id="title">Nexus-BS</title>
  <desc id="desc">Nexus-BS TETRA base station brand lockup with radio tower mark.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f1f4f4"/>
      <stop offset="0.5" stop-color="#cfd8db"/>
      <stop offset="1" stop-color="#aebbc0"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f7f7"/>
      <stop offset="0.52" stop-color="#cbd6da"/>
      <stop offset="1" stop-color="#9ca9af"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1d3546"/>
      <stop offset="1" stop-color="#081b29"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1aa4df"/>
      <stop offset="0.52" stop-color="#116fcc"/>
      <stop offset="1" stop-color="#0751a6"/>
    </linearGradient>
    <pattern id="scan" width="1" height="6" patternUnits="userSpaceOnUse">
      <rect width="1" height="3" fill="#ffffff" opacity="0.24"/>
      <rect y="3" width="1" height="3" fill="#52646d" opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.4" flood-color="#0a1b24" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="8" y="10" width="344" height="90" rx="8" fill="url(#panel)" stroke="#6b7d85" stroke-width="3"/>
  <rect x="12" y="14" width="336" height="82" rx="6" fill="url(#scan)" opacity="0.72"/>
  <path d="M14 20h332" stroke="#ffffff" stroke-width="2" opacity="0.58"/>
  <path d="M14 94h332" stroke="#718088" stroke-width="2" opacity="0.42"/>

  <g filter="url(#shadow)">
    <rect x="22" y="20" width="82" height="82" rx="10" fill="url(#badge)" stroke="#8da0a8" stroke-width="1.6"/>
    <path d="M25 25h76" stroke="#ffffff" stroke-width="1.8" opacity="0.72"/>
    <path d="M25 98h76" stroke="#7a878d" stroke-width="1.5" opacity="0.42"/>
  </g>

  <g transform="translate(26 28) scale(0.72)">
    <path d="M10 20 31 2 58 27v15L37 24v38l-11 9-16-14Z" fill="url(#ink)"/>
    <path d="M10 57 31 78V62L21 53V31L10 20Z" fill="#102b3a"/>
    <path d="M41 78h24l23-22V35L76 46v12L60 73H41Z" fill="url(#blue)"/>
    <g fill="none" stroke="#132b39" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.6">
      <path d="M49 76 56 38 64 76"/>
      <path d="M50.5 67h12"/>
      <path d="M52 58h9"/>
      <path d="m53 67 8-9m-7-7 9 16"/>
    </g>
    <circle cx="56" cy="36" r="8.5" fill="url(#blue)"/>
    <g fill="none" stroke="url(#blue)" stroke-linecap="round" stroke-width="7">
      <path d="M71 35c6 6 8 13 7 21"/>
      <path d="M73 21c13 8 20 20 19 36"/>
      <path d="M75 7c21 10 32 29 31 52"/>
    </g>
  </g>

  <text x="116" y="71"
        fill="url(#ink)"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="47"
        font-weight="900"
        letter-spacing="0">Nexus-BS</text>
  <path d="M123 78h178" stroke="#ffffff" stroke-width="1.5" opacity="0.38"/>
</svg>
