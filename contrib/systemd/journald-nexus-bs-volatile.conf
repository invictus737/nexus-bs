# Volatile circular journal profile for Nexus-BS appliance deployments.
#
# Install with:
#   sudo install -D -m 0644 contrib/systemd/journald-nexus-bs-volatile.conf \
#     /etc/systemd/journald.conf.d/90-nexus-bs-volatile.conf
#   sudo systemctl restart systemd-journald.service

[Journal]
Storage=volatile
Compress=yes
Seal=no
RuntimeMaxUse=64M
RuntimeKeepFree=32M
RuntimeMaxFileSize=8M
RuntimeMaxFiles=8
MaxRetentionSec=1day
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no
